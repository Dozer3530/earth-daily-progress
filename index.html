<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>Earth Daily - Data Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Bauhaus: paper ground, primaries as data, geometric sans, flat + gridded.
     Sized to fill an iframe (Google Sites embed) as happily as a full page. */
  :root{--paper:#F0ECE1;--card:#FBFAF6;--ink:#161514;--ink-2:#6E6A5F;--ink-3:#A8A296;
    --rule:#161514;--rule-soft:#D8D3C6;--blue:#1E50A2;--red:#D8371F;--yellow:#F3C20D;--track:#E7E2D5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;
    padding:22px;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .shp{display:inline-block;flex:none;width:9px;height:9px}
  .shp.circle{border-radius:50%}
  .shp.tri{width:0;height:0;background:none!important;border-left:5px solid transparent;
    border-right:5px solid transparent;border-bottom:9px solid var(--yellow)}
  .shp.diamond{width:7px;height:7px;transform:rotate(45deg)}
  /* header */
  .top{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--rule);padding-bottom:16px;flex-wrap:wrap}
  .lock{display:flex;gap:4px;align-items:center}
  .lock i{width:14px;height:14px;display:block}
  .lock .c{border-radius:50%;background:var(--red)}
  .lock .q{background:var(--blue)}
  .lock .t{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid var(--yellow)}
  .wm{font-weight:800;font-size:22px;letter-spacing:-.02em}
  .ttl{font-weight:700;font-size:12px;color:var(--ink-2);letter-spacing:.02em}
  .stamp{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-2);
    display:flex;align-items:center;gap:7px}
  .stamp .d{width:8px;height:8px;border-radius:50%;background:var(--blue)}
  /* totals */
  .tot{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--rule);margin-top:18px}
  .tot .t{padding:12px 14px;border-right:1.5px solid var(--rule)}
  .tot .t:last-child{border-right:none}
  .tot .t.fill{background:var(--yellow)}
  .tot .k{font-size:10px;letter-spacing:.13em;color:var(--ink-2);font-weight:700}
  .tot .t.fill .k{color:var(--ink)}
  .tot .v{font-weight:800;font-size:25px;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .tot .v .u{font-size:13px;color:var(--ink-3);font-weight:700}
  .tot .t.fill .v .u{color:var(--ink)}
  /* week cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:20px}
  .card{border:1.5px solid var(--rule);background:var(--card)}
  .card .hd{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1.5px solid var(--rule);flex-wrap:wrap}
  .card.new .hd{background:var(--yellow)}
  .wk{font-weight:800;font-size:14px;letter-spacing:-.01em;word-break:break-word}
  .pill{font-size:9px;letter-spacing:.1em;padding:2px 8px;font-weight:700;border:1.5px solid var(--ink);margin-left:auto}
  .pill.done{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .crop{padding:12px 15px}
  .crop+.crop{border-top:1px solid var(--rule-soft)}
  .crop h4{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .crop h4 .ex{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-2)}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
  .bar .lab{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .bar .lab .n{font-size:10px;letter-spacing:.05em;color:var(--ink-2);font-weight:700;flex:1}
  .bar .lab b{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .track{height:6px;background:var(--track)}
  .track i{display:block;height:100%}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;padding-top:14px;
    border-top:1px solid var(--rule-soft);font-size:10.5px;color:var(--ink-2);font-weight:700}
  .legend span{display:flex;align-items:center;gap:7px}
  .empty{color:var(--ink-3);margin-top:24px;font-weight:600}
  /* trends */
  .sec{margin-top:28px;padding-top:20px;border-top:1.5px solid var(--rule)}
  .sec h2{font-weight:800;font-size:16px;letter-spacing:-.01em;margin-bottom:14px}
  .ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ttabs.cat{margin-bottom:18px}
  .ttab{font:700 11px "Jost",system-ui,sans-serif;padding:6px 13px;border:1.5px solid var(--rule);
    background:var(--card);color:var(--ink-2);cursor:pointer}
  .ttab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .tcard{border:1.5px solid var(--rule);background:var(--card);padding:12px 14px}
  .tcard .th{display:flex;align-items:baseline;gap:8px}
  .tn{font-size:11px;font-weight:700;color:var(--ink-2)}
  .tv{margin-left:auto;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .tu{font-size:10px;color:var(--ink-3);font-weight:700;margin-left:2px}
  .dl{font-size:10px;font-weight:700;margin-left:6px}
  .du{color:var(--blue)} .dd{color:var(--red)} .df{color:var(--ink-3)}
  .tcard svg{width:100%;height:84px;display:block;margin-top:4px}
  .tempty{color:var(--ink-3);font-size:12px;padding:10px 0;grid-column:1/-1}
</style></head>
<body>
  <div class="top">
    <span class="lock"><i class="c"></i><i class="q"></i><i class="t"></i></span>
    <span class="wm">Earth Daily</span>
    <span class="ttl">data progress</span>
    <span class="stamp"><span class="d"></span><span id="stamp"></span></span>
  </div>
  <div id="tot"></div>
  <div id="grid" class="grid"></div>
  <div class="sec" id="trendsSec">
    <h2>Trends — week over week</h2>
    <div id="trendsBox"></div>
  </div>
  <div class="legend">
    <span><i class="shp circle" style="background:var(--blue)"></i>field · survey123</span>
    <span><i class="shp" style="background:var(--red)"></i>lab · pt2r</span>
    <span><i class="shp tri"></i>pest · cards</span>
    <span><i class="shp diamond" style="background:var(--ink)"></i>disease · lab tests</span>
  </div>
<script>
var PAYLOAD = {"updated": "2026-07-27 14:45", "weeks": [{"iso_week": "2026-W24", "label": null, "created_at": "2026-07-27 20:45:33", "crops": [{"crop_code": "canola", "display_name": "Canola", "total_locations": 9, "field_filled": 3, "field_expected": 297, "field_locations": 1, "lab_filled": 0, "lab_expected": 441, "lab_locations": 0, "pest_cards": 0, "pest_uploaded": false, "disease_points": 0, "disease_uploaded": false, "reactive_points": 0, "extra_points": 0}, {"crop_code": "corn", "display_name": "Corn", "total_locations": 9, "field_filled": 0, "field_expected": 405, "field_locations": 0, "lab_filled": 0, "lab_expected": 459, "lab_locations": 0, "pest_cards": 0, "pest_uploaded": false, "disease_points": 0, "disease_uploaded": false, "reactive_points": 0, "extra_points": 0}]}], "trends": {"canola": {"display_name": "Canola", "weeks": ["2026-W24"], "categories": [{"key": "soil", "label": "Soil readings"}, {"key": "disease_growth", "label": "Disease & growth"}, {"key": "nutrients", "label": "Nutrient values"}, {"key": "ratios", "label": "Nutrient ratios"}, {"key": "pests", "label": "Pest counts"}], "series_by_cat": {"soil": [{"key": "temp", "label": "Soil temp", "unit": "\u00b0C", "points": [null]}, {"key": "moisture", "label": "Soil moisture", "unit": "%", "points": [27.0]}, {"key": "ec", "label": "Soil EC", "unit": "dS/m", "points": [null]}], "disease_growth": [{"key": "disease", "label": "Disease flags", "unit": "", "points": [0.0]}, {"key": "growth", "label": "Growth stage", "unit": "BBCH", "points": [10.0]}], "nutrients": [{"key": "N", "label": "N", "unit": "%", "points": [null]}, {"key": "NO3N", "label": "NO3N", "unit": "ppm", "points": [null]}, {"key": "P", "label": "P", "unit": "%", "points": [null]}, {"key": "K", "label": "K", "unit": "%", "points": [null]}, {"key": "Ca", "label": "Ca", "unit": "%", "points": [null]}, {"key": "Mg", "label": "Mg", "unit": "%", "points": [null]}, {"key": "S", "label": "S", "unit": "%", "points": [null]}, {"key": "Zn", "label": "Zn", "unit": "ppm", "points": [null]}, {"key": "Mn", "label": "Mn", "unit": "ppm", "points": [null]}, {"key": "Fe", "label": "Fe", "unit": "ppm", "points": [null]}, {"key": "Cu", "label": "Cu", "unit": "ppm", "points": [null]}, {"key": "B", "label": "B", "unit": "ppm", "points": [null]}, {"key": "Mo", "label": "Mo", "unit": "ppm", "points": [null]}, {"key": "Al", "label": "Al", "unit": "ppm", "points": [null]}, {"key": "Na", "label": "Na", "unit": "%", "points": [null]}, {"key": "Cl", "label": "Cl", "unit": "%", "points": [null]}], "ratios": [{"key": "N/S", "label": "N/S", "unit": "", "points": [null]}, {"key": "N/K", "label": "N/K", "unit": "", "points": [null]}, {"key": "P/S", "label": "P/S", "unit": "", "points": [null]}, {"key": "P/Zn", "label": "P/Zn", "unit": "", "points": [null]}, {"key": "K/Mg", "label": "K/Mg", "unit": "", "points": [null]}, {"key": "K/Mn", "label": "K/Mn", "unit": "", "points": [null]}, {"key": "Ca/B", "label": "Ca/B", "unit": "", "points": [null]}, {"key": "Fe/Mn", "label": "Fe/Mn", "unit": "", "points": [null]}], "pests": []}}}};
var SHAPES = {field:['circle','var(--blue)'], lab:['square','var(--red)'],
              pest:['tri','var(--yellow)'], disease:['diamond','var(--ink)']};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shp(kind){
  var s=SHAPES[kind]||['square','var(--ink)'];
  if(s[0]==='tri') return '<i class="shp tri"></i>';
  var cls = s[0]==='circle' ? 'shp circle' : (s[0]==='diamond' ? 'shp diamond' : 'shp');
  return '<i class="'+cls+'" style="background:'+s[1]+'"></i>';
}
function bar(kind, label, n, total){
  var pct = total ? Math.round(n/total*100) : 0;
  return '<div class="bar"><div class="lab">'+shp(kind)+'<span class="n">'+label+'</span><b>'+n+'/'+total+'</b></div>'
    + '<div class="track"><i style="width:'+pct+'%;background:'+SHAPES[kind][1]+'"></i></div></div>';
}
document.getElementById("stamp").textContent = "updated " + PAYLOAD.updated;

// ---- totals across all weeks ----
var W = PAYLOAD.weeks || [];
var tField=0, tExp=0, tLab=0, tPend=0, tExtra=0;
W.forEach(function(w){ (w.crops||[]).forEach(function(c){
  var t=c.total_locations||0;
  tField+=c.field_locations||0; tExp+=t; tLab+=c.lab_locations||0;
  tExtra+=(c.reactive_points||0)+(c.extra_points||0);
});});
tPend = Math.max(0, tExp - tLab);
document.getElementById("tot").innerHTML =
  '<div class="tot">'
  + '<div class="t fill"><div class="k">weeks tracked</div><div class="v">'+W.length+'</div></div>'
  + '<div class="t"><div class="k">points scouted</div><div class="v">'+tField+'<span class="u">/'+tExp+'</span></div></div>'
  + '<div class="t"><div class="k">lab results in</div><div class="v">'+tLab+'<span class="u">/'+tExp+'</span></div></div>'
  + '<div class="t"><div class="k">extra points</div><div class="v">'+tExtra+'</div></div>'
  + '</div>';

var g = document.getElementById("grid");
if(!W.length){ g.innerHTML = '<div class="empty">No weeks yet.</div>'; }
else g.innerHTML = W.map(function(w, idx){
  var crops = (w.crops||[]).map(function(c){
    var t = c.total_locations || 9;
    var extra = (c.reactive_points||0)+(c.extra_points||0);
    return '<div class="crop"><h4>'+esc(c.display_name)
      + (extra ? '<span class="ex">+'+extra+' reactive/extra</span>' : '') + '</h4>'
      + '<div class="bars">'
      + bar("field","field", c.field_locations||0, t)
      + bar("lab","lab", c.lab_locations||0, t)
      + bar("pest","pest", c.pest_cards||0, t)
      + bar("disease","disease", c.disease_points||0, t)
      + '</div></div>';
  }).join("");
  var complete = (w.crops||[]).length && (w.crops||[]).every(function(c){
    var t=c.total_locations||9; return (c.field_locations||0)>=t && (c.lab_locations||0)>=t; });
  var pill = idx===0 ? '<span class="pill">latest</span>'
           : (complete ? '<span class="pill done">complete</span>' : '');
  return '<div class="card'+(idx===0?' new':'')+'"><div class="hd"><span class="wk">'
    + esc(w.iso_week)+'</span>'+pill+'</div>'+crops+'</div>';
}).join("");

// ---- trends: field-average, crop tabs x category tabs ----
var TREND_PALETTE = ["var(--blue)","var(--red)","var(--yellow)","var(--ink)"];
var TSTATE = { crop: "", cat: "soil" };

function trendChart(points, color){
  var n = points.length;
  var vals = points.filter(function(v){ return v!=null; });
  if(!vals.length) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(lo===hi){ lo-=1; hi+=1; } else { var p=(hi-lo)*0.15; lo-=p; hi+=p; }
  var W=520,H=120,mx=8,top=10,bot=12;
  function X(i){ return n<=1 ? W/2 : mx + i*(W-2*mx)/(n-1); }
  function Y(v){ return (H-bot) - ((v-lo)/(hi-lo))*((H-bot)-top); }
  var line="", firstX=null, lastX=null, lastY=null;
  points.forEach(function(v,i){
    if(v==null) return;
    var x=X(i), y=Y(v);
    if(firstX===null) firstX=x;
    lastX=x; lastY=y;
    line += (line?" L":"M") + x.toFixed(1) + " " + y.toFixed(1);
  });
  var area = firstX===null ? "" : ("M"+firstX.toFixed(1)+" "+(H-bot)+" L"+line.slice(1)+" L"+lastX.toFixed(1)+" "+(H-bot)+" Z");
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'
    + '<path d="'+area+'" fill="'+color+'" opacity="0.10"></path>'
    + '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>'
    + '<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3" fill="'+color+'"></circle>'
    + '</svg>';
}
function lastTwo(points){
  var last=null, prev=null;
  points.forEach(function(v){ if(v!=null){ prev=last; last=v; } });
  return [last, prev];
}
function deltaEl(curr, prev){
  if(curr==null||prev==null) return "";
  var d = +(curr-prev).toFixed(1);
  if(d>0) return '<span class="dl du">&#9650; '+d+'</span>';
  if(d<0) return '<span class="dl dd">&#9660; '+Math.abs(d)+'</span>';
  return '<span class="dl df">&ndash; 0</span>';
}
function renderTrends(){
  var sec = document.getElementById("trendsSec");
  var box = document.getElementById("trendsBox");
  var T = PAYLOAD.trends || {};
  var crops = Object.keys(T);
  if(!crops.length){ if(sec) sec.style.display = "none"; return; }
  if(!T[TSTATE.crop]) TSTATE.crop = crops[0];
  var cd = T[TSTATE.crop];

  var cropTabs = crops.map(function(c){
    return '<button class="ttab'+(c===TSTATE.crop?' on':'')+'" data-crop="'+c+'">'+esc(T[c].display_name)+'</button>';
  }).join("");
  var catTabs = cd.categories.map(function(c){
    return '<button class="ttab'+(c.key===TSTATE.cat?' on':'')+'" data-cat="'+c.key+'">'+esc(c.label)+'</button>';
  }).join("");

  var series = cd.series_by_cat[TSTATE.cat] || [];
  var catLabel = (cd.categories.filter(function(c){ return c.key===TSTATE.cat; })[0]||{}).label || "";
  var cardsHtml = series.length ? series.map(function(s,i){
    var lt = lastTwo(s.points);
    var color = TREND_PALETTE[i % TREND_PALETTE.length];
    var chart = trendChart(s.points, color);
    if(!chart) return "";
    var lastTxt = lt[0]==null ? "—" : lt[0];
    return '<div class="tcard"><div class="th"><span class="tn">'+esc(s.label)+'</span>'
      + '<span class="tv">'+lastTxt+'<span class="tu">'+esc(s.unit||"")+'</span>'+deltaEl(lt[0],lt[1])+'</span></div>'
      + chart + '</div>';
  }).join("") : "";
  if(!cardsHtml.trim()) cardsHtml = '<div class="tempty">No '+esc(catLabel.toLowerCase())+' data yet for '+esc(cd.display_name)+'.</div>';

  box.innerHTML = '<div class="ttabs">'+cropTabs+'</div>'
    + '<div class="ttabs cat">'+catTabs+'</div>'
    + '<div class="tgrid">'+cardsHtml+'</div>';

  Array.prototype.forEach.call(box.querySelectorAll("[data-crop]"), function(b){
    b.onclick = function(){ TSTATE.crop = b.dataset.crop; renderTrends(); };
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-cat]"), function(b){
    b.onclick = function(){ TSTATE.cat = b.dataset.cat; renderTrends(); };
  });
}
renderTrends();
</script>
</body></html>
